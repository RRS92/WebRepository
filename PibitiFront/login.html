<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="form-container">
        <h2>Login</h2>
        <input type="text" id="loginMatricula" placeholder="Matrícula" />
        <input type="password" id="loginPassword" placeholder="Senha" />
        <button onclick="login()">Entrar</button>
        <p>Não possui cadastro? <a href="register.html">Registrar-se</a></p>
    </div>

<script>
    async function login() {
        const matricula = document.getElementById('loginMatricula').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!matricula || !password) {
            alert('Por favor, preencha todos os campos');
            return;
        }

        try {
            const res = await fetch('http://127.0.0.1:5000/user/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ matricula, password })
            });

            const data = await res.json();

            if (res.ok) {
                // Salva o token no localStorage para uso futuro
                localStorage.setItem('token', data.content.token);
                alert('Login realizado com sucesso!');
                window.location.href = 'home.html';
            } else {
                alert('Usuário ou senha inválidos');
            }
        } catch (error) {
            alert('Erro na conexão com o servidor');
            console.error(error);
        }
    }
</script>
</body>
</html>
