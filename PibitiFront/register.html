<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Sistema de Hiperlactatemia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Criar Conta</h2>
        <input type="text" id="registerUserName" placeholder="Usuário">
        <input type="text" id="registerMatricula" placeholder="Matrícula">
        <input type="password" id="registerPassword" placeholder="Senha">
        <button onclick="register()">Cadastrar</button>
        <p>Já tem conta? <a href="login.html">Entrar</a></p>
    </div>

    <script>
        async function register() {
            const userName = document.getElementById('registerUserName').value;
            const matricula = document.getElementById('registerMatricula').value;
            const password = document.getElementById('registerPassword').value;

            const res = await fetch('http://127.0.0.1:5000/user/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userName, matricula, password })
            });

            if (res.ok) {
                alert('Cadastro realizado com sucesso!');
                window.location.href = 'login.html';
            } else {
                alert('Erro ao cadastrar!');
            }
        }
    </script>
</body>
</html>
